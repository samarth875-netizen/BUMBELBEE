<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab — Bumblebee</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Samarth's ambient backdrop -->
  <div class="bb-backdrop-stage" aria-hidden="true">
    <video id="bb-ambient-film" autoplay muted loop playsinline preload="auto" poster="">
      <source src="assets/video.mp4" type="video/mp4" />
      <source src="assets/bg.mp4" type="video/mp4" />
    </video>
    <div class="bb-film-scrim"></div>
    <div class="bb-backdrop-fallbackwash"></div>
  </div>

  <div class="bb-honey-topline"></div>
  <!-- Samarth's corner weather -->
  <div id="bb-corner-weather" class="bb-corner-weather" aria-live="polite" title="Live weather">
    <span id="bb-corner-weather-glyph" class="bb-corner-weather-glyph">◐</span>
    <span id="bb-corner-weather-deg" class="bb-corner-weather-deg">—°</span>
    <span id="bb-corner-weather-words" class="bb-corner-weather-words">loading…</span>
    <span id="bb-corner-weather-city" class="bb-corner-weather-city"></span>
  </div>

  <!-- Samarth's hero stack -->
  <main class="bb-hero-column">
    <div class="bb-lock-clockbox">
      <div id="bb-lock-time" class="bb-lock-time">00:00</div>
      <div id="bb-lock-dateline" class="bb-lock-dateline">—</div>
      <div id="bb-lock-hello" class="bb-lock-hello">Good evening</div>
    </div>

    <form id="bb-find-bar" class="bb-find-lozenge" autocomplete="off" spellcheck="false">
      <svg class="bb-find-mag" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="bb-find-field" type="text" placeholder="Search Google or type a URL" aria-label="Search" autocomplete="off" />
      <button type="submit" class="bb-find-go" aria-label="Search">↗</button>
      <div id="bb-find-droplist" class="bb-find-droplist bb-is-hidden" role="listbox" aria-label="Search suggestions"></div>
    </form>

    <!-- Samarth's 5 most-visited -->
    <nav class="bb-visit-tray" id="bb-visit-tray" aria-label="Quick links">
      <a href="https://youtube.com" class="bb-visit-tile" data-index="0">
        <span class="bb-visit-tile-art bb-art-yt">
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="#FF0000" d="M23.5 12s0-3.9-.5-5.8a1 1 0 0 0-.7-.7C20.4 4.9 12 4.9 12 4.9s-8.4 0-10.3.6a1 1 0 0 0-.7.7C.5 8.1.5 12 .5 12s0 3.9.5 5.8a1 1 0 0 0 .7.7c1.9.6 10.3.6 10.3.6s8.4 0 10.3-.6a1 1 0 0 0 .7-.7c.5-1.9.5-5.8.5-5.8Z"/><path fill="#fff" d="M9.7 15.6 15.6 12 9.7 8.4z"/></svg>
        </span>
        <span class="bb-visit-tile-name">YouTube</span>
      </a>
      <a href="https://github.com" class="bb-visit-tile" data-index="1">
        <span class="bb-visit-tile-art bb-art-gh">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="#181717" d="M12 0.3C5.4 0.3 0 5.7 0 12.3c0 5.3 3.4 9.8 8.2 11.4.6.1.8-.3.8-.6v-2c-3.3.7-4-1.4-4-1.4-.5-1.3-1.2-1.6-1.2-1.6-1-0.7.1-0.7.1-0.7 1.1.1 1.7 1.1 1.7 1.1 1 1.7 2.6 1.2 3.2.9.1-.7.4-1.2.7-1.5-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2 0-.3-.5-1.3.1-2.7 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.4.2 2.4.1 2.7.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6C20.6 22.1 24 17.6 24 12.3 24 5.7 18.6.3 12 .3Z"/></svg>
        </span>
        <span class="bb-visit-tile-name">GitHub</span>
      </a>
      <a href="https://x.com" class="bb-visit-tile" data-index="2">
        <span class="bb-visit-tile-art bb-art-x">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="#000" d="M18.9 2.2H22l-6.9 7.9L23.3 22h-6.4l-5-6.6L5.9 22H2.8l7.4-8.5L2.2 2.2h6.6l4.5 6 5.6-6ZM17.8 20h1.7L7.2 3.9H5.3L17.8 20Z"/></svg>
        </span>
        <span class="bb-visit-tile-name">X</span>
      </a>
      <a href="https://mail.google.com" class="bb-visit-tile" data-index="3">
        <span class="bb-visit-tile-art bb-art-gmail">
          <svg viewBox="52 42 88 66" width="28" height="28" aria-hidden="true" role="img">
            <path fill="#4285f4" d="M58 108h14V74L52 59v43c0 3.32 2.69 6 6 6"/>
            <path fill="#34a853" d="M120 108h14c3.32 0 6-2.69 6-6V59l-20 15"/>
            <path fill="#fbbc04" d="M120 48v26l20-15v-8c0-7.42-8.47-11.65-14.4-7.2"/>
            <path fill="#ea4335" d="M72 74V48l24 18 24-18v26L96 92"/>
            <path fill="#c5221f" d="M52 51v8l20 15V48l-5.6-4.2c-5.94-4.45-14.4-.22-14.4 7.2"/>
          </svg>
        </span>
        <span class="bb-visit-tile-name">Gmail</span>
      </a>
    </nav>

  </main>

  <!-- Samarth's retro TV -->
  <aside class="bb-tv-shell bb-retro-tv" id="bb-tv-shell" aria-label="TV Bumblebee">
    <div class="bb-tv-topbar" id="bb-tv-topbar">
      <div class="bb-tv-lights" aria-hidden="true">
        <button class="bb-pip bb-pip-shut" data-action="close" aria-label="Close TV"><span>×</span></button>
        <button class="bb-pip bb-pip-snooze" data-action="minimize" aria-label="Minimize TV"><span>−</span></button>
        <button class="bb-pip bb-pip-big" data-action="expand" aria-label="Expand TV"><span>⤢</span></button>
      </div>
      <span class="bb-tv-name">BUMBLEBEE — TV</span>
      <span class="bb-audio-chip" id="bb-audio-chip">muted</span>
    </div>

    <div class="bb-retro-cabinet" id="bb-retro-cabinet">
      <div class="bb-retro-tube" id="bb-retro-tube">
        <video id="bb-tv-film" autoplay muted loop playsinline preload="auto">
          <source src="assets/sticker.mp4" type="video/mp4" />
          <source src="assets/video.mp4" type="video/mp4" />
        </video>
      </div>
      <img src="assets/tv-frame.png" class="bb-retro-chassis-img" alt="Retro TV frame" draggable="false" />
    </div>
    <div class="bb-deck-controls bb-tv-remote-strip" id="bb-tv-remote-strip">
      <button id="bb-key-play-toggle" class="bb-roundkey bb-key-play" aria-label="Play with sound">
        <svg class="bb-glyph-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72L19 12z"/></svg>
        <svg class="bb-glyph-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button id="bb-key-mute-toggle" class="bb-roundkey bb-key-mute" aria-label="Mute toggle">
        <svg class="bb-glyph-muted" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5L6 9H2v6h4l5 4z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        <svg class="bb-glyph-loud" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M17.8 6.2a8 8 0 0 1 0 11.6"/></svg>
      </button>
      <div class="bb-scrub-group">
        <div class="bb-scrub-rail" id="bb-scrub-rail">
          <div class="bb-scrub-juice" id="bb-scrub-juice"></div>
          <div class="bb-scrub-knob" id="bb-scrub-knob"></div>
        </div>
        <span class="bb-timecode" id="bb-timecode">0:00 / 0:32</span>
      </div>
    </div>
  </aside>

  <!-- Samarth's paper note -->
  <aside class="bb-paper-note" id="bb-paper-note" aria-label="Sticky note">
    <div class="bb-note-topbar" id="bb-note-topbar">
      <div class="bb-note-lights">
        <button class="bb-pip bb-pip-shut" data-sticky="close" aria-label="Close sticky note"><span>×</span></button>
        <button class="bb-pip bb-pip-snooze" data-sticky="minimize" aria-label="Minimize sticky note"><span>−</span></button>
        <button class="bb-pip bb-pip-big" data-sticky="expand" aria-label="Expand sticky note"><span>⤢</span></button>
      </div>
      <span class="bb-note-nameplate">STICKY NOTE</span>
      <span class="bb-note-actions">
        <button id="bb-note-clear" class="bb-note-clear-key" title="Clear note">clear</button>
      </span>
    </div>
    <div class="bb-note-pad-area" id="bb-note-pad-area">
      <textarea id="bb-note-scribble" placeholder="Type your thoughts…

• Drag by header to move
• Auto-saves instantly
• Pick a color below" spellcheck="false"></textarea>
    </div>
    <div class="bb-note-foot">
      <div class="bb-paint-swatches" id="bb-paint-swatches">
        <button class="bb-paint-dot bb-is-lit" data-color="#FFE55C" style="background:#FFE55C" aria-label="Yellow"></button>
        <button class="bb-paint-dot" data-color="#FFB3C1" style="background:#FFB3C1" aria-label="Pink"></button>
        <button class="bb-paint-dot" data-color="#B9FBC0" style="background:#B9FBC0" aria-label="Mint"></button>
        <button class="bb-paint-dot" data-color="#A0C4FF" style="background:#A0C4FF" aria-label="Blue"></button>
        <button class="bb-paint-dot" data-color="#FFD60A" style="background:#FFD60A" aria-label="Bumblebee amber"></button>
        <button class="bb-paint-dot" data-color="#FFFFFF" style="background:#FFFFFF; border:1px solid #ddd" aria-label="White"></button>
      </div>
      <span class="bb-note-microhint">drag • auto-save • <span id="bb-note-charcount">0</span> chars</span>
    </div>
  </aside>

  <!-- bring-backs -->
  <button id="bb-bringback-tv" class="bb-bringback-pill bb-is-hidden" aria-label="Restore video sticker">
    <span class="bb-bringback-dot" style="background:#FF5F56"></span> Show video sticker
  </button>
  <button id="bb-bringback-note" class="bb-bringback-pill bb-is-hidden" style="left:28px; right:auto;" aria-label="Restore sticky note">
    <span class="bb-bringback-dot" style="background:#FFE55C; border:1px solid rgba(0,0,0,0.12)"></span> Show sticky note
  </button>

  <div id="bb-missing-reel-toast" class="bb-missing-reel-toast bb-is-hidden">
    <span class="bb-toast-pulse-dot"></span>
    Drop <strong>video.mp4</strong> → background, <strong>sticker.mp4</strong> → corner. Or use <code>bg.mp4</code> alias.
  </div>

  <!-- Samarth's Discover -->
  <section id="bb-discover-deck" class="bb-discover-deck" aria-label="Discover news">
    <div class="bb-discover-masthead">
      <div class="bb-discover-titlewrap">
        <h2 class="bb-discover-heading">Discover</h2>
        <p class="bb-discover-sub">Scroll for today's headlines — like the default Chrome tab</p>
      </div>
      <div class="bb-discover-controls">
        <div class="bb-discover-topics" id="bb-discover-topics">
          <button class="bb-topic-chip bb-is-lit" data-feed="top">Top</button>
          <button class="bb-topic-chip" data-feed="technology">Tech</button>
          <button class="bb-topic-chip" data-feed="sports">Sports</button>
          <button class="bb-topic-chip" data-feed="business">Business</button>
          <button class="bb-topic-chip" data-feed="entertainment">Entertainment</button>
        </div>
        <button id="bb-discover-retry" class="bb-discover-retry" aria-label="Refresh news">↻</button>
      </div>
    </div>
    <div id="bb-discover-reel" class="bb-discover-reel" role="feed"></div>
    <div id="bb-reel-bubbles" class="bb-reel-bubbles" aria-hidden="true"></div>
    <div id="bb-discover-status" class="bb-discover-status">Loading headlines…</div>
  </section>

  <script src="script.js"></script>
</body>
</html>
